name: Build on commit

on:
  push:
    branches:
      - '*'

jobs:
  quality:
    name: Test and Vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Run Tests
        run: go test ./...

      - name: Run Vet
        run: go vet ./...

  build:
    name: Build Release Assets
    needs: quality
    runs-on: ubuntu-latest

    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64, 386]
        binaryname: [manticore-registry]
        # Exclude incompatible couple of GOOS and GOARCH values
        exclude:
          - os: darwin
            arch: 386

    env:
      GO111MODULE: 'on'
      CGO_ENABLED: '0'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.0'

      - name: Build Binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          mkdir -p build
          OUTPUT_PATH="./build/${{ matrix.binaryname }}-${{ matrix.os }}-${{ matrix.arch }}"
          # Build the binary (the module is at the repository root)
          go build -ldflags="-s -w" -o "$OUTPUT_PATH${{ matrix.os == 'windows' && '.exe' || '' }}"
